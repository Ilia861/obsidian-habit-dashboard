name: Draft unified bilingual release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check tag matches package version
        run: node scripts/check-tag.cjs
      - name: Validate, build and test
        run: npm test
      - name: Create reviewable draft with unified ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag --draft
          --title "Habit Dashboard $GITHUB_REF_NAME"
          --notes-file dist/RELEASE.md
          dist/*.zip dist/SHA256SUMS.txt
